seed_everything: 7
trainer:
  checkpoint_callback: true
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        save_top_k: 1
        monitor: val_ExpRate
        mode: max
        filename: '{epoch}--{val_ExpRate:.4f}'
  gpus: 1
  check_val_every_n_epoch: 20
  max_epochs: 300
  deterministic: true


model:
  d_model: 256
  growth_rate: 24
  num_layers: 16

  nhead: 8
  num_decoder_layers: 3
  dim_feedforward: 1024
  dropout: 0.3

  dc: 32
  cross_coverage: true
  self_coverage: true

  use_relation_aux: true
  relation_hidden_channels: 128
  relation_loss_weight: 0.1
  num_relation_classes: 7
  use_rqm: true
  use_rmc: true

  beam_size: 10
  max_len: 200
  alpha: 1.0
  early_stopping: false
  temperature: 1.0

  optimizer_type: sgd
  learning_rate: 0.05
  patience: 100

data:
  zipfile_path: data.zip
  test_year: 2014
  train_batch_size: 8
  eval_batch_size: 4
  num_workers: 4
  scale_aug: true

  use_relation_maps: true
  gt_cache_dir: data/cached_maps
